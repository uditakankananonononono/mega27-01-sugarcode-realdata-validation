[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sc_validate"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pyhmmer>=0.12"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
